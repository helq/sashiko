[ai]
provider = "gemini"
model = "gemini-4-argon"
max_input_tokens = 950000
temperature = 1.0

[ai.gemini]
explicit_prompt_caching = false
# max_tokens = 131072
# thinking_level = "HIGH"

[review]
# Reviews run concurrently up to this many patches. Sized for one developer's
# machine; the daemon's own Settings.toml uses a much larger fan-out.
concurrency = 4
# effort = "mid"  # Options: "low", "mid" (default for Argon 4), "high", "dynamic"

# Time window (in seconds) for detecting sibling patchset batches (default 30s).
# batch_window_secs = 30

# Priority rules for patchset queue ordering (evaluated in order; last match wins).
# Range is 1 to 999. Default priority is 500. Values > 500 are elevated; values < 500 are deprioritized.
# Note: regex matches the full patchset subject as ingested, which may include prefixes such as [PATCH ...] or #123:.
# [[review.priority_rules]]
# regex = "(?i)^PRODKERNEL:"
# priority = 750
#
# [[review.priority_rules]]
# regex = "(?i)security"
# priority = 999

# Automatic batch deprioritization for large submissions.
# When multiple patchsets arrive within batch_window_secs (default 30s), cap their priority
# according to threshold tiers to avoid starving individual submissions.
# [[review.batch_tiers]]
# min_size = 5
# priority = 300
#
# [[review.batch_tiers]]
# min_size = 20
# priority = 100
